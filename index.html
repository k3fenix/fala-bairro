<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>Fala do Bairro - Notícias, Comunidade e Guia Local</title>
    
    <!-- SEO Local e Metadados -->
    <meta name="description" content="O portal comunitário do seu bairro: notícias locais em tempo real, mural de moradores, alertas de animais perdidos, guia de comércio e classificados.">
    <meta name="keywords" content="fala do bairro, notícias locais, mural do bairro, animais perdidos, comércio local, classificados">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.faladobairro.online/">

    <!-- Open Graph / Redes Sociais -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:url" content="https://www.faladobairro.online/">
    <meta property="og:title" content="Fala do Bairro - O que está acontecendo no seu bairro">
    <meta property="og:description" content="Acompanhe notícias, converse com vizinhos, encontre animais perdidos e valorize o comércio da sua região.">
    <meta property="og:image" content="https://www.faladobairro.online/og-cover.jpg">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fala do Bairro - Seu Portal Comunitário">
    <meta name="twitter:description" content="Tudo o que acontece no seu bairro em um só lugar.">

    <!-- Dados Estruturados Schema.org -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://www.faladobairro.online/#website",
          "url": "https://www.faladobairro.online/",
          "name": "Fala do Bairro",
          "description": "Portal Comunitário de Notícias e Serviços de Bairro",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.faladobairro.online/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://www.faladobairro.online/#organization",
          "name": "Fala do Bairro",
          "url": "https://www.faladobairro.online/",
          "logo": "https://www.faladobairro.online/favicon.svg"
        }
      ]
    }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
