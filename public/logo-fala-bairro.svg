<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <!-- Gradiente do telhado laranja brilhante com efeito 3D -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC500" />
      <stop offset="35%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E54300" />
    </linearGradient>

    <!-- Gradiente das bordas do telhado -->
    <linearGradient id="roofInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA800" />
      <stop offset="100%" stop-color="#D83600" />
    </linearGradient>

    <!-- Gradiente dos blocos da janela -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="60%" stop-color="#FFA000" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>

    <!-- Gradiente do texto FALA (Branco com leve cinza metalizado) -->
    <linearGradient id="whiteTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Gradiente dos textos DO e BAIRRO (Laranja 3D pop vibrante) -->
    <linearGradient id="orangeTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="25%" stop-color="#FF8000" />
      <stop offset="80%" stop-color="#F04E00" />
      <stop offset="100%" stop-color="#C42A00" />
    </linearGradient>

    <!-- Sombra projetada geral -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="softGaze" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- CONTORNO PRETO ROBUSTO EXTERNO DA CASA -->
    <!-- Chaminé direita com contorno arredondado -->
    <rect x="435" y="44" width="58" height="96" rx="14" fill="#0b0f14" stroke="#000000" stroke-width="8" />

    <!-- Corpo de fundo preto da Casa -->
    <polygon points="350,68 152,228 220,290 480,290 548,228" fill="#13171d" stroke="#000000" stroke-width="14" stroke-linejoin="round" />

    <!-- Telhado Externo Laranja com Contorno Preto Grosso -->
    <path d="M 350 48 
             L 535 200 
             A 18 18 0 0 1 540 226
             L 522 242
             A 18 18 0 0 1 498 240
             L 350 118 
             L 202 240 
             A 18 18 0 0 1 178 242 
             L 160 226 
             A 18 18 0 0 1 165 200 
             Z" 
          fill="url(#roofGrad)" 
          stroke="#000000" 
          stroke-width="12" 
          stroke-linejoin="round" />

    <!-- Brilho / Detalhe interno do Telhado -->
    <path d="M 350 64 
             L 516 200 
             L 500 216 
             L 350 94 
             L 200 216 
             L 184 200 
             Z" 
          fill="none" 
          stroke="#FFDF66" 
          stroke-width="5" 
          opacity="0.85" 
          stroke-linecap="round" />

    <!-- 4 Janelas Quadradas Laranjas 3D com divisória preta -->
    <g transform="translate(320, 114)">
      <!-- Janela Top-Left -->
      <rect x="0" y="0" width="26" height="26" rx="5" fill="url(#windowGrad)" stroke="#000000" stroke-width="3" />
      <rect x="2" y="2" width="22" height="6" rx="3" fill="#FFF2A3" opacity="0.6" />

      <!-- Janela Top-Right -->
      <rect x="34" y="0" width="26" height="26" rx="5" fill="url(#windowGrad)" stroke="#000000" stroke-width="3" />
      <rect x="36" y="2" width="22" height="6" rx="3" fill="#FFF2A3" opacity="0.6" />

      <!-- Janela Bottom-Left -->
      <rect x="0" y="34" width="26" height="26" rx="5" fill="url(#windowGrad)" stroke="#000000" stroke-width="3" />
      <rect x="2" y="36" width="22" height="6" rx="3" fill="#FFF2A3" opacity="0.6" />

      <!-- Janela Bottom-Right -->
      <rect x="34" y="34" width="26" height="26" rx="5" fill="url(#windowGrad)" stroke="#000000" stroke-width="3" />
      <rect x="36" y="36" width="22" height="6" rx="3" fill="#FFF2A3" opacity="0.6" />
    </g>

    <!-- Silhueta preta que abraça a tipografia (Outer Black Plaque) -->
    <path d="M 125 210 
             L 245 195 
             L 420 195 
             L 575 220 
             Q 640 260 625 360 
             Q 590 445 350 445 
             Q 110 445 75 360 
             Q 60 260 125 210 Z" 
          fill="#000000" />

    <!-- ==========================================
         LINHA 1: "FALA" (Branco) + "DO" (Laranja)
         ========================================== -->
    <!-- Contorno preto robusto atrás dos textos superiores -->
    <g font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="94">
      <!-- FALA (BRANCO 3D) -->
      <text x="135" y="292" fill="#000000" stroke="#000000" stroke-width="16" stroke-linejoin="round" letter-spacing="-3">FALA</text>
      <text x="135" y="295" fill="#8896A6" letter-spacing="-3">FALA</text>
      <text x="135" y="292" fill="url(#whiteTextGrad)" letter-spacing="-3">FALA</text>

      <!-- DO (LARANJA 3D) -->
      <text x="445" y="286" fill="#000000" stroke="#000000" stroke-width="16" stroke-linejoin="round" letter-spacing="-2" font-size="82">DO</text>
      <text x="445" y="289" fill="#9C2000" letter-spacing="-2" font-size="82">DO</text>
      <text x="445" y="286" fill="url(#orangeTextGrad)" letter-spacing="-2" font-size="82">DO</text>
      <!-- Brilho no 'DO' -->
      <text x="445" y="286" fill="none" stroke="#FFEAA0" stroke-width="2" letter-spacing="-2" font-size="82" opacity="0.65">DO</text>
    </g>

    <!-- ==========================================
         LINHA 2: "BAIRRO" (Laranja 3D Gigante)
         ========================================== -->
    <g font-family="'Montserrat', 'Arial Black', Impact, sans-serif" font-weight="900" font-size="124" letter-spacing="-3">
      <!-- Sombra / Extrusão 3D -->
      <text x="350" y="406" text-anchor="middle" fill="#000000" stroke="#000000" stroke-width="24" stroke-linejoin="round">BAIRRO</text>
      <text x="350" y="412" text-anchor="middle" fill="#751500">BAIRRO</text>
      <text x="350" y="408" text-anchor="middle" fill="#9C2000">BAIRRO</text>
      
      <!-- Letra Principal -->
      <text x="350" y="402" text-anchor="middle" fill="url(#orangeTextGrad)">BAIRRO</text>

      <!-- Brilho Superior Curvado nas letras -->
      <text x="350" y="402" text-anchor="middle" fill="none" stroke="#FFECA0" stroke-width="2.5" opacity="0.7">BAIRRO</text>
    </g>

    <!-- ARCO / FAIXA LARANJA INFERIOR 3D -->
    <g>
      <!-- Sombra do arco -->
      <path d="M 108 438 Q 350 388 592 438 Q 350 405 108 438 Z" fill="#000000" />
      <!-- Arco Laranja com gradiente -->
      <path d="M 112 432 Q 350 382 588 432 Q 350 398 112 432 Z" fill="url(#orangeTextGrad)" stroke="#000000" stroke-width="3" />
      <!-- Filete de brilho no arco -->
      <path d="M 130 427 Q 350 386 570 427" fill="none" stroke="#FFECA0" stroke-width="2" opacity="0.8" />
    </g>
  </g>
</svg>
