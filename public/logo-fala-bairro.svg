<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5100" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Balão de conversa laranja superior -->
  <g transform="translate(195, 20)">
    <path d="M 75 0 C 116 0 150 28 150 62 C 150 82 137 100 118 111 C 115 125 106 142 90 148 C 96 136 98 123 96 117 C 89 120 82 121 75 121 C 34 121 0 93 0 62 C 0 28 34 0 75 0 Z" fill="url(#bubbleGrad)" />
    <!-- 3 pontinhos brancos -->
    <circle cx="45" cy="58" r="9.5" fill="#ffffff" />
    <circle cx="75" cy="58" r="9.5" fill="#ffffff" />
    <circle cx="105" cy="58" r="9.5" fill="#ffffff" />
  </g>

  <!-- Silhueta dos Prédios / Cidade (Preto / Dark Slate) -->
  <g fill="#101820">
    <rect x="135" y="105" width="22" height="60" rx="1" />
    <rect x="160" y="85" width="28" height="80" rx="1" />
    <rect x="175" y="70" width="18" height="95" rx="1" />
    <rect x="200" y="95" width="25" height="70" rx="1" />

    <rect x="315" y="88" width="20" height="75" rx="1" />
    <rect x="338" y="68" width="26" height="95" rx="1" />
    <rect x="367" y="85" width="22" height="78" rx="1" />
    <rect x="392" y="105" width="18" height="58" rx="1" />
  </g>

  <!-- Árvores verdes laterais -->
  <g id="arvore-esquerda">
    <rect x="117" y="138" width="8" height="42" fill="#101820" rx="2" />
    <circle cx="121" cy="125" r="21" fill="#15803d" />
  </g>
  <g id="arvore-direita">
    <rect x="415" y="138" width="8" height="42" fill="#101820" rx="2" />
    <circle cx="419" cy="125" r="21" fill="#15803d" />
  </g>

  <!-- Casinhas da Comunidade (Casas com telhado escuro, paredes brancas com contorno e janelas laranja) -->
  <!-- Casa Esquerda -->
  <g>
    <!-- Telhado -->
    <path d="M 135 150 L 180 115 L 225 150 Z" fill="#101820" stroke="#101820" stroke-width="3" stroke-linejoin="round" />
    <!-- Parede Branca -->
    <path d="M 143 148 L 180 119 L 217 148 L 217 185 L 143 185 Z" fill="#ffffff" stroke="#101820" stroke-width="4" stroke-linejoin="round" />
    <!-- Janela Laranja dividida em 4 -->
    <g fill="#FF5100">
      <rect x="172" y="152" width="7" height="7" rx="0.5" />
      <rect x="181" y="152" width="7" height="7" rx="0.5" />
      <rect x="172" y="161" width="7" height="7" rx="0.5" />
      <rect x="181" y="161" width="7" height="7" rx="0.5" />
    </g>
  </g>

  <!-- Casa Direita -->
  <g>
    <!-- Telhado -->
    <path d="M 315 150 L 360 115 L 405 150 Z" fill="#101820" stroke="#101820" stroke-width="3" stroke-linejoin="round" />
    <!-- Parede Branca -->
    <path d="M 323 148 L 360 119 L 397 148 L 397 185 L 323 185 Z" fill="#ffffff" stroke="#101820" stroke-width="4" stroke-linejoin="round" />
    <!-- Janela Laranja dividida em 4 -->
    <g fill="#FF5100">
      <rect x="352" y="152" width="7" height="7" rx="0.5" />
      <rect x="361" y="152" width="7" height="7" rx="0.5" />
      <rect x="352" y="161" width="7" height="7" rx="0.5" />
      <rect x="361" y="161" width="7" height="7" rx="0.5" />
    </g>
  </g>

  <!-- Casa Central (Maior / Principal) -->
  <g>
    <!-- Telhado -->
    <path d="M 205 142 L 270 95 L 335 142 Z" fill="#101820" stroke="#101820" stroke-width="4" stroke-linejoin="round" />
    <!-- Parede Branca -->
    <path d="M 215 140 L 270 100 L 325 140 L 325 190 L 215 190 Z" fill="#ffffff" stroke="#101820" stroke-width="5" stroke-linejoin="round" />
    <!-- Janela Laranja Central Maior -->
    <g fill="#FF5100">
      <rect x="257" y="138" width="11" height="11" rx="1" />
      <rect x="272" y="138" width="11" height="11" rx="1" />
      <rect x="257" y="153" width="11" height="11" rx="1" />
      <rect x="272" y="153" width="11" height="11" rx="1" />
    </g>
  </g>

  <!-- Curva do chão / morro -->
  <path d="M 90 198 Q 270 180 450 198 Q 270 187 90 198 Z" fill="#101820" />

  <!-- Texto: FALA DO (FALA em preto, DO em laranja) -->
  <text x="90" y="258" font-family="'Arial Black', Impact, Montserrat, sans-serif" font-weight="900" font-size="64" fill="#101820" letter-spacing="-1.5">FALA</text>
  <text x="365" y="258" font-family="'Arial Black', Impact, Montserrat, sans-serif" font-weight="900" font-size="64" fill="#FF5100" letter-spacing="-1.5">DO</text>

  <!-- Texto: BAIRRO (Laranja Vibrante grande) -->
  <text x="270" y="328" text-anchor="middle" font-family="'Arial Black', Impact, Montserrat, sans-serif" font-weight="900" font-size="78" fill="#FF5100" letter-spacing="-2">BAIRRO</text>

  <!-- Linha curva laranja decorativa embaixo de BAIRRO -->
  <path d="M 95 344 Q 270 334 445 344 Q 270 338 95 344 Z" fill="#FF5100" />
</svg>
